<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Citation Engine</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1e1e1e;
    color: #d4d4d4;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── header ── */
  header {
    background: #252526;
    border-bottom: 1px solid #3e3e42;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
  }
  header span {
    font-size: 12px;
    color: #858585;
  }
  .badge {
    background: #0e639c;
    color: #ffffff;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
  }

  /* ── layout ── */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── sidebar ── */
  .sidebar {
    width: 280px;
    background: #252526;
    border-right: 1px solid #3e3e42;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 16px;
  }

  .sidebar h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #858585;
    font-weight: 600;
  }

  /* ── upload zone ── */
  .upload-zone {
    border: 1.5px dashed #3e3e42;
    border-radius: 8px;
    padding: 20px 12px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: #0e639c;
    background: #0e639c18;
  }
  .upload-zone .icon {
    font-size: 28px;
    margin-bottom: 8px;
  }
  .upload-zone p {
    font-size: 12px;
    color: #858585;
    line-height: 1.5;
  }
  .upload-zone p strong {
    color: #4fc1ff;
  }
  #file-input { display: none; }

  /* ── document list ── */
  .doc-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    overflow-y: auto;
  }

  .doc-item {
    background: #2d2d2d;
    border: 1px solid #3e3e42;
    border-radius: 6px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  .doc-item .doc-icon { color: #4fc1ff; }
  .doc-item .doc-name {
    flex: 1;
    color: #d4d4d4;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .doc-item .doc-chunks {
    color: #858585;
    font-size: 11px;
    white-space: nowrap;
  }

  /* ── reset button ── */
  .btn-reset {
    background: none;
    border: 1px solid #3e3e42;
    color: #858585;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
  }
  .btn-reset:hover {
    border-color: #f44747;
    color: #f44747;
  }

  /* ── chat area ── */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ── message bubbles ── */
  .message {
    display: flex;
    gap: 12px;
    max-width: 820px;
  }
  .message.user { flex-direction: row-reverse; align-self: flex-end; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .avatar.bot { background: #0e639c; }
  .avatar.user-av { background: #6b3fa0; }

  .bubble {
    background: #2d2d2d;
    border: 1px solid #3e3e42;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.6;
    max-width: 680px;
  }
  .message.user .bubble {
    background: #0e3a5e;
    border-color: #0e639c;
    color: #d4d4d4;
  }

  /* ── sources ── */
  .sources {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sources-label {
    font-size: 11px;
    color: #858585;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
  }
  .source-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #1e1e1e;
    border: 1px solid #3e3e42;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 11px;
    color: #858585;
  }
  .source-chip .source-name { color: #4fc1ff; }

  /* ── confidence badges ── */
  .conf-high   { color: #4ec9b0; }
  .conf-medium { color: #dcdcaa; }
  .conf-low    { color: #f44747; }

  /* ── input bar ── */
  .input-bar {
    background: #252526;
    border-top: 1px solid #3e3e42;
    padding: 16px 24px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #question-input {
    flex: 1;
    background: #3c3c3c;
    border: 1px solid #3e3e42;
    border-radius: 8px;
    color: #d4d4d4;
    font-size: 14px;
    padding: 10px 14px;
    resize: none;
    outline: none;
    font-family: inherit;
    line-height: 1.5;
    max-height: 120px;
    transition: border-color 0.2s;
  }
  #question-input:focus { border-color: #0e639c; }
  #question-input::placeholder { color: #555; }
  #question-input:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-send {
    background: #0e639c;
    border: none;
    border-radius: 8px;
    color: #ffffff;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
    height: 40px;
  }
  .btn-send:hover:not(:disabled) { background: #1177bb; }
  .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── typing indicator ── */
  .typing {
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }
  .typing span {
    width: 6px; height: 6px;
    background: #858585;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }

  /* ── upload progress ── */
  .upload-progress {
    font-size: 12px;
    color: #4fc1ff;
    text-align: center;
    padding: 4px 0;
    min-height: 18px;
  }

  /* ── scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3e3e42; border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="avatar bot">⚡</div>
  <h1>RAG Citation Engine</h1>
  <span>document-grounded Q&amp;A</span>
  <div class="badge">v1.0</div>
</header>

<div class="layout">

  <!-- sidebar -->
  <aside class="sidebar">
    <h2>Documents</h2>

    <div class="upload-zone" id="upload-zone">
      <div class="icon">📄</div>
      <p>Drop files here or<br>
        <strong>click to upload</strong><br>
        <span>.md &nbsp;.txt &nbsp;.pdf</span>
      </p>
      <input type="file" id="file-input"
             accept=".md,.txt,.pdf" multiple>
    </div>

    <div class="upload-progress" id="upload-progress"></div>

    <div class="doc-list" id="doc-list"></div>

    <button class="btn-reset" id="btn-reset">
      🗑 Clear all documents
    </button>
  </aside>

  <!-- chat -->
  <main class="chat-area">
    <div class="messages" id="messages">
      <div class="message">
        <div class="avatar bot">⚡</div>
        <div class="bubble">
          Hello! Upload a document on the left to get started.
          I'll answer questions about it with citations showing
          exactly where each answer came from.
        </div>
      </div>
    </div>

    <div class="input-bar">
      <textarea
        id="question-input"
        rows="1"
        placeholder="Upload a document first, then ask a question..."
        disabled
      ></textarea>
      <button class="btn-send" id="btn-send" disabled>Send</button>
    </div>
  </main>

</div>

<script>
const api = async (path, opts={}) => {
  const res = await fetch(path, opts)
  if (!res.ok) {
    const err = await res.json().catch(() => ({detail: res.statusText}))
    throw new Error(err.detail || res.statusText)
  }
  return res.json()
}

// ── state ──────────────────────────────────────────────────
let uploadedDocs = []

// ── elements ───────────────────────────────────────────────
const uploadZone    = document.getElementById('upload-zone')
const fileInput     = document.getElementById('file-input')
const uploadProg    = document.getElementById('upload-progress')
const docList       = document.getElementById('doc-list')
const messages      = document.getElementById('messages')
const questionInput = document.getElementById('question-input')
const btnSend       = document.getElementById('btn-send')
const btnReset      = document.getElementById('btn-reset')

// ── upload zone interactions ────────────────────────────────
uploadZone.addEventListener('click', () => fileInput.click())

uploadZone.addEventListener('dragover', e => {
  e.preventDefault()
  uploadZone.classList.add('drag-over')
})
uploadZone.addEventListener('dragleave', () => {
  uploadZone.classList.remove('drag-over')
})
uploadZone.addEventListener('drop', e => {
  e.preventDefault()
  uploadZone.classList.remove('drag-over')
  handleFiles(e.dataTransfer.files)
})

fileInput.addEventListener('change', () => {
  handleFiles(fileInput.files)
  fileInput.value = ''
})

async function handleFiles(files) {
  for (const file of files) {
    uploadProg.textContent = `Uploading ${file.name}...`
    try {
      const form = new FormData()
      form.append('file', file)
      const res = await api('/upload', { method: 'POST', body: form })
      uploadedDocs.push({ name: file.name, chunks: res.chunks_added })
      renderDocList()
      enableChat()
      uploadProg.textContent = `✓ ${file.name} — ${res.chunks_added} chunk(s)`
      setTimeout(() => uploadProg.textContent = '', 3000)
    } catch(e) {
      uploadProg.textContent = `✗ ${file.name}: ${e.message}`
      setTimeout(() => uploadProg.textContent = '', 5000)
    }
  }
}

function renderDocList() {
  docList.innerHTML = uploadedDocs.map(d => `
    <div class="doc-item">
      <span class="doc-icon">📄</span>
      <span class="doc-name" title="${d.name}">${d.name}</span>
      <span class="doc-chunks">${d.chunks} chunks</span>
    </div>
  `).join('')
}

function enableChat() {
  questionInput.disabled = false
  questionInput.placeholder = 'Ask a question about your documents...'
  btnSend.disabled = false
}

function disableChat() {
  questionInput.disabled = true
  questionInput.placeholder = 'Upload a document first...'
  btnSend.disabled = true
}

// ── reset ──────────────────────────────────────────────────
btnReset.addEventListener('click', async () => {
  if (!confirm('Clear all uploaded documents?')) return
  await api('/reset', { method: 'DELETE' })
  uploadedDocs = []
  renderDocList()
  disableChat()
  addBotMessage('All documents cleared. Upload a new document to continue.')
})

// ── chat ───────────────────────────────────────────────────
btnSend.addEventListener('click', sendMessage)
questionInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault()
    sendMessage()
  }
})

// auto-resize textarea
questionInput.addEventListener('input', () => {
  questionInput.style.height = 'auto'
  questionInput.style.height = questionInput.scrollHeight + 'px'
})

async function sendMessage() {
  const question = questionInput.value.trim()
  if (!question) return

  addUserMessage(question)
  questionInput.value = ''
  questionInput.style.height = 'auto'
  btnSend.disabled = true

  const typingId = addTypingIndicator()

  try {
    const res = await api('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    })
    removeTypingIndicator(typingId)
    addBotMessage(res.answer, res.sources, res.confidence)
  } catch(e) {
    removeTypingIndicator(typingId)
    addBotMessage(`Error: ${e.message}`)
  } finally {
    btnSend.disabled = false
    questionInput.focus()
  }
}

// ── message rendering ──────────────────────────────────────
function addUserMessage(text) {
  const div = document.createElement('div')
  div.className = 'message user'
  div.innerHTML = `
    <div class="avatar user-av">👤</div>
    <div class="bubble">${escHtml(text)}</div>
  `
  messages.appendChild(div)
  scrollToBottom()
}

function addBotMessage(text, sources=[], confidence=null) {
  const confClass = {
    high: 'conf-high', medium: 'conf-medium', low: 'conf-low'
  }[confidence] || ''

  const confLabel = confidence ? `
    <span class="${confClass}" style="font-size:11px;margin-left:8px">
      ● ${confidence} confidence
    </span>` : ''

  const sourcesHtml = sources.length ? `
    <div class="sources">
      <div class="sources-label">Sources</div>
      ${sources.map(s => `
        <div class="source-chip">
          📄 <span class="source-name">${escHtml(s.page_title)}</span>
          <span>${(s.relevance_score * 100).toFixed(0)}% match</span>
        </div>
      `).join('')}
    </div>` : ''

  const div = document.createElement('div')
  div.className = 'message'
  div.innerHTML = `
    <div class="avatar bot">⚡</div>
    <div class="bubble">
      <span>${escHtml(text)}</span>
      ${confLabel}
      ${sourcesHtml}
    </div>
  `
  messages.appendChild(div)
  scrollToBottom()
}

function addTypingIndicator() {
  const id = 'typing-' + Date.now()
  const div = document.createElement('div')
  div.className = 'message'
  div.id = id
  div.innerHTML = `
    <div class="avatar bot">⚡</div>
    <div class="bubble">
      <div class="typing">
        <span></span><span></span><span></span>
      </div>
    </div>
  `
  messages.appendChild(div)
  scrollToBottom()
  return id
}

function removeTypingIndicator(id) {
  document.getElementById(id)?.remove()
}

function scrollToBottom() {
  messages.scrollTop = messages.scrollHeight
}

function escHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
}

// ── init: check if docs already uploaded ──────────────────
;(async () => {
  try {
    const status = await api('/status')
    if (status.ready) enableChat()
  } catch(e) {
    console.warn('Status check failed:', e)
  }
})()
</script>
</body>
</html>
